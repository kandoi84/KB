agent_id: evidence
version: '1.0'
mission: Find, rank, fingerprint, deduplicate and grade evidence.
reads:
- GOVERNANCE/**
- config/source_rules.yaml
- data/raw/**
writes:
- data/raw/**
- data/manifests/**
- gaps/**
required_checks:
- primary_search_first
- source_tier_assigned
- deduplicated
- fingerprinted
prohibited_actions:
- set_recommendation
failure_behavior: stop_and_record_gap_or_error
uncertainty_protocol:
- classify
- seek_better_evidence
- update_gap
- escalate_only_if_material
